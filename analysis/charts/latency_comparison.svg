<svg width="720" height="420" xmlns="http://www.w3.org/2000/svg" style="background:#0e131f; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="baselineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <text x="360" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">Comparative Client Navigation Latency by Network Profile</text>
  <text x="360" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Mean Latency (ms) with 95% Confidence Bounds (N=30 runs per scenario)</text>

  <!-- Legend -->
  <rect x="220" y="80" width="16" height="12" fill="url(#baselineGrad)" rx="2"/>
  <text x="244" y="91" fill="#cbd5e1" font-size="12">Baseline (On-Demand)</text>
  <rect x="420" y="80" width="16" height="12" fill="url(#optGrad)" rx="2"/>
  <text x="444" y="91" fill="#cbd5e1" font-size="12">Optimized (Hover >100ms + SWR)</text>

  <!-- Axes & Grid -->
  <line x1="80" y1="120" x2="80" y2="340" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="660" y2="340" stroke="#334155" stroke-width="1.5"/>

  <!-- Y Axis Ticks (0 to 450 ms) -->
  <text x="70" y="344" fill="#64748b" font-size="10" text-anchor="end">0ms</text>
  <line x1="75" y1="340" x2="660" y2="340" stroke="#1e293b" stroke-dasharray="3,3"/>

  <text x="70" y="289" fill="#64748b" font-size="10" text-anchor="end">100ms</text>
  <line x1="75" y1="285" x2="660" y2="285" stroke="#1e293b" stroke-dasharray="3,3"/>

  <text x="70" y="234" fill="#64748b" font-size="10" text-anchor="end">200ms</text>
  <line x1="75" y1="230" x2="660" y2="230" stroke="#1e293b" stroke-dasharray="3,3"/>

  <text x="70" y="179" fill="#64748b" font-size="10" text-anchor="end">300ms</text>
  <line x1="75" y1="175" x2="660" y2="175" stroke="#1e293b" stroke-dasharray="3,3"/>

  <text x="70" y="124" fill="#64748b" font-size="10" text-anchor="end">400ms</text>
  <line x1="75" y1="120" x2="660" y2="120" stroke="#1e293b" stroke-dasharray="3,3"/>

  <!-- Broadband Baseline -->
  <rect x="115" y="322.0" width="45" height="18.0" fill="url(#baselineGrad)" rx="4"/>
  <text x="138" y="314.0" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">36.8ms</text>

  <!-- Broadband Optimized -->
  <rect x="180" y="330.0" width="45" height="10.0" fill="url(#optGrad)" rx="4"/>
  <text x="202" y="322.0" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">20.5ms</text>

  <!-- Scenario Label -->
  <text x="170" y="365" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Broadband</text>

  <!-- Fast 4G Baseline -->
  <rect x="315" y="283.6" width="45" height="56.4" fill="url(#baselineGrad)" rx="4"/>
  <text x="338" y="275.6" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">115.4ms</text>

  <!-- Fast 4G Optimized -->
  <rect x="380" y="324.2" width="45" height="15.8" fill="url(#optGrad)" rx="4"/>
  <text x="402" y="316.2" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">32.4ms</text>

  <!-- Scenario Label -->
  <text x="370" y="365" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Fast 4G</text>

  <!-- Throttled 3G Baseline -->
  <rect x="505" y="139.5" width="45" height="200.5" fill="url(#baselineGrad)" rx="4"/>
  <text x="528" y="131.5" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">410.1ms</text>

  <!-- Throttled 3G Optimized -->
  <rect x="570" y="264.4" width="45" height="75.6" fill="url(#optGrad)" rx="4"/>
  <text x="592" y="256.4" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">154.7ms</text>

  <!-- Scenario Label -->
  <text x="560" y="365" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Throttled 3G</text>
</svg>